- name: Sinra Pro
  color: "#2196F3"
  description: "The complete project management platform combining V-Model and Agile methodologies"
  pricing_tiers:
    - period: Monthly
      price: "10"
      currency: "€"
      billing: "/month"
      plan_type: "monthly"
    - period: Annual
      price: "96"
      currency: "€"
      billing: "/year"
      plan_type: "annual"
      original_price: "120"
      struck_price: "96"
      has_black_friday: true
      black_friday_price: "60"
      promo_code: "BLACKFRIDAY2025"
      recommended: true
  features:
    - text: Pay per seat, flexible team sizing
      highlight: true
    - text: Unlimited projects and releases
      highlight: true
    - text: Rich text editor for specs
      highlight: true
    - text: Real-time workload planning
      highlight: true
    - text: Integrated QA management
      highlight: true
    - text: Advanced templates and customization
      highlight: true
    - text: Kanban, List, and Release views
      highlight: true
    - text: Release management with go-live checklists
      highlight: true
    - text: Priority email and chat support
      highlight: true
    - text: Custom workflows and roles
      highlight: false
    - text: Advanced security features
      highlight: false
  call_to_action:
    link: https://app.sinra.dev/users/sign_up
    text: Start Free Trial

