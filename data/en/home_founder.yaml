title: "Built by a tech lead, for tech teams"
body: "My name is Thomas. For nearly 20 years, I've been building and leading software teams, from startups to large enterprises. I've seen the same problems everywhere: fuzzy specs, forgotten tests, releases nobody controlled. My teams and I built Sinra to give growing teams the structure we wish we'd found ready-made."
