title: "A clear method, built into the tool"
intro: "No need to master Scrum or hire an agile coach. Sinra organizes work around four simple concepts, and every team member knows where to go from their first login."
steps:
  - number: "1"
    title: "Capability"
    description: "what the product needs to do, described and validated before it's built."
  - number: "2"
    title: "Issue"
    description: "the concrete work, tied to its spec. You know what to build and why."
  - number: "3"
    title: "Cycle"
    description: "a work period sized to your team's real capacity."
  - number: "4"
    title: "Release"
    description: "what ships to production, tested and validated."
