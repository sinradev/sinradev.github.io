- title: "On sait quoi construire"
  body: "Chaque issue est reliée à sa spécification. Les specs sont rédigées en parallèle du développement, avec un suivi dédié pour le product owner. Fini les tickets d'une ligne qu'on interprète chacun à sa façon."
  image: /assets/images/screenshots/43-spec-pipeline.png
  alt: "Spec Pipeline : suivi de la rédaction des spécifications par capability"
  width: 1440
  height: 900
- title: "On sait si l'équipe peut suivre"
  body: "Sinra calcule la charge de chaque personne par cycle, en tenant compte de sa disponibilité réelle. Vous voyez les surcharges avant que le cycle commence, pas deux jours avant la deadline. Les tâches inachevées sont automatiquement reportées au cycle suivant."
  image: /assets/images/screenshots/05-cycle-workload.png
  alt: "Vue de charge de travail par cycle"
  width: 1440
  height: 783
- title: "On livre sans stress"
  body: "Les tests font partie du flux de travail, liés directement aux releases. Avant chaque mise en production, vous savez ce qui a été testé, accepté ou rejeté."
  image: /assets/images/screenshots/20-testing-detail.png
  alt: "Détail d'un cas de test lié à une release"
  width: 1440
  height: 900
