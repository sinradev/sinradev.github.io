- name: Sinra Pro
  color: "#2196F3"
  description: "La plateforme complète de gestion de projet combinant V-Model et Agile"
  pricing_tiers:
    - period: Mensuel
      price: "10"
      currency: "€"
      billing: "/mois"
      plan_type: "monthly"
    - period: Annuel
      price: "96"
      currency: "€"
      billing: "/an"
      plan_type: "annual"
      original_price: "120"
      struck_price: "96"
      has_black_friday: true
      black_friday_price: "60"
      promo_code: "BLACKFRIDAY2025"
      recommended: true
  features:
    - text: Facturation à l'utilisateur, taille d'équipe flexible
      highlight: true
    - text: Projets et releases illimités
      highlight: true
    - text: Éditeur de texte enrichi pour les specs
      highlight: true
    - text: Planification de la charge en temps réel
      highlight: true
    - text: Gestion QA intégrée
      highlight: true
    - text: Modèles et personnalisation avancés
      highlight: true
    - text: Vues Kanban, Liste et Release
      highlight: true
    - text: Gestion des releases avec checklists de mise en production
      highlight: true
    - text: Support email et chat prioritaire
      highlight: true
    - text: Workflows et rôles personnalisés
      highlight: false
    - text: Sécurité avancée
      highlight: false
  call_to_action:
    link: https://app.sinra.dev/users/sign_up
    text: Démarrer l'essai gratuit

- name: Équipes medtech, healthtech & fintech
  color: "#2196F3"
  description: "Sinra Pro accompagné pour les équipes en secteur réglementé"
  pricing_tiers:
    # TODO THOMAS: prix (sur devis ou tarif fixe).
    - period: Sur devis
      price: null
      billing: null
      plan_type: "on_quote"
  features:
    - text: Tout Sinra Pro
      highlight: true
    - text: Onboarding accompagné
      highlight: true
    - text: Aide à la mise en place de la traçabilité
      highlight: true
    - text: Échanges prioritaires avec le fondateur
      highlight: true
  # TODO THOMAS: valider ce contenu ; ne rien promettre que tu ne peux pas tenir seul (SSO, SLA...).
  call_to_action:
    link: contact/
    text: Réserver 20 min
    internal: true

