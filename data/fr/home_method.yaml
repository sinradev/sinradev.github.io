title: "Une méthode claire, intégrée à l'outil"
intro: "Pas besoin de maîtriser Scrum ou d'embaucher un coach agile. Sinra organise le travail autour de quatre notions simples, et chaque membre de l'équipe sait où aller dès sa première connexion."
steps:
  - number: "1"
    title: "Capability"
    description: "ce que le produit doit permettre, décrit et validé avant d'être développé."
  - number: "2"
    title: "Issue"
    description: "le travail concret, lié à sa spec. On sait quoi construire et pourquoi."
  - number: "3"
    title: "Cycle"
    description: "une période de travail dimensionnée selon la capacité réelle de l'équipe."
  - number: "4"
    title: "Release"
    description: "ce qui part en production, testé et validé."
