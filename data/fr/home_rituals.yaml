title: "Les rituels d'une équipe mature, sans la lourdeur"
body: "Planning, rétrospective, revue de validation, analyse d'incident : Sinra les structure pour vous et les relie au cycle ou à la release concernés. Les décisions ne se perdent plus dans Slack."
