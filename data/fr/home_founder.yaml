title: "Construit par un tech lead, pour les équipes tech"
body: "Je m'appelle Thomas. Depuis près de 20 ans, je développe et je dirige des équipes logicielles, de la startup au grand groupe. J'ai vu les mêmes problèmes partout : des specs floues, des tests oubliés, des releases subies. Mes équipes et moi avons construit Sinra pour donner aux équipes qui grandissent la structure que nous aurions aimé trouver toute faite."
