title: "Un método claro, integrado en la herramienta"
intro: "No hace falta dominar Scrum ni contratar un coach agile. Sinra organiza el trabajo en torno a cuatro conceptos simples, y cada miembro del equipo sabe adónde ir desde su primer inicio de sesión."
steps:
  - number: "1"
    title: "Capability"
    description: "lo que el producto debe permitir, descrito y validado antes de desarrollarse."
  - number: "2"
    title: "Issue"
    description: "el trabajo concreto, vinculado a su spec. Se sabe qué construir y por qué."
  - number: "3"
    title: "Cycle"
    description: "un período de trabajo dimensionado según la capacidad real del equipo."
  - number: "4"
    title: "Release"
    description: "lo que pasa a producción, probado y validado."
