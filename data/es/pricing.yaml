- name: Sinra Pro
  color: "#2196F3"
  description: "La plataforma completa de gestión de proyectos que combina las metodologías V-Model y Agile"
  pricing_tiers:
    - period: Mensual
      price: "10"
      currency: "€"
      billing: "/mes"
      plan_type: "monthly"
    - period: Anual
      price: "96"
      currency: "€"
      billing: "/año"
      plan_type: "annual"
      original_price: "120"
      struck_price: "96"
      has_black_friday: true
      black_friday_price: "60"
      promo_code: "BLACKFRIDAY2025"
      recommended: true
  features:
    - text: Pago por puesto, tamaño de equipo flexible
      highlight: true
    - text: Projects y releases ilimitados
      highlight: true
    - text: Editor de texto enriquecido para specs
      highlight: true
    - text: Planificación de la carga en tiempo real
      highlight: true
    - text: Gestión de QA integrada
      highlight: true
    - text: Templates y personalización avanzados
      highlight: true
    - text: Vistas Kanban, Lista y Release
      highlight: true
    - text: Gestión de releases con checklists de puesta en producción
      highlight: true
    - text: Soporte prioritario por email y chat
      highlight: true
    - text: Flujos de trabajo y roles personalizados
      highlight: false
    - text: Funciones de seguridad avanzadas
      highlight: false
  call_to_action:
    link: https://app.sinra.dev/users/sign_up
    text: Iniciar Prueba Gratuita

- name: Equipos medtech, healthtech y fintech
  color: "#2196F3"
