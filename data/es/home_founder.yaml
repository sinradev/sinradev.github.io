title: "Construido por un tech lead, para equipos tech"
body: "Me llamo Thomas. Desde hace casi 20 años, desarrollo y dirijo equipos de software, desde startups hasta grandes empresas. He visto los mismos problemas en todas partes: specs confusas, tests olvidados, releases sufridos. Mis equipos y yo construimos Sinra para dar a los equipos en crecimiento la estructura que nos hubiera gustado encontrar ya hecha."
