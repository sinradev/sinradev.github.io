title: "¿Reconoces a tu equipo?"
paragraphs:
  - "Los deadlines se retrasan cada sprint, y nadie sabe realmente por qué."
  - "Una feature está « terminada » en desarrollo, pero nadie la probó antes de pasar a producción."
  - "A una semana del release, nadie puede decir qué sale realmente."
conclusion: "No es un problema de talento. Es un problema de método."
