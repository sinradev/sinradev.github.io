- title: "Cada issue tiene su spec"
  body: "Cada issue está vinculada a su especificación. Las specs se redactan en paralelo al desarrollo, con una vista dedicada para el product owner. Se acabaron los tickets de una línea que cada quien interpreta a su manera."
  image: /assets/images/screenshots/43-spec-pipeline.png
  alt: "Spec Pipeline: seguimiento de la redacción de specs por capability"
  width: 1440
  height: 900
- title: "La carga se ve antes de desbordar"
  body: "Sinra calcula la carga de cada persona por cycle, teniendo en cuenta su disponibilidad real. Ves las sobrecargas antes de que empiece el cycle, no dos días antes del deadline. Las tareas sin terminar se trasladan automáticamente al siguiente cycle."
  image: /assets/images/screenshots/05-cycle-workload.png
  alt: "Vista de carga de trabajo por cycle"
  width: 1440
  height: 783
- title: "Nada pasa a producción sin haberse probado"
  body: "Los tests forman parte del flujo de trabajo, vinculados directamente a los releases. Antes de cada puesta en producción, sabes qué se probó, se aceptó o se rechazó."
  image: /assets/images/screenshots/20-testing-detail.png
  alt: "Detalle de un caso de prueba vinculado a un release"
  width: 1440
  height: 900
