{{ $lang := .Language.Lang }}
{{ $v := index hugo.Data $lang "home_verticals" }}
{{ with $v }}
<section class="verticals py-20 bg-base-200">
  <div class="container mx-auto px-6 max-w-3xl text-center">
    <h2 class="text-3xl md:text-4xl font-bold mb-6">{{ .title }}</h2>
    <p class="text-lg text-base-content/80 leading-relaxed mb-8">{{ .body }}</p>
    <div class="flex flex-col sm:flex-row justify-center gap-4">
      {{ range .links }}
      <a href="{{ relLangURL .slug }}" class="btn btn-outline">{{ .text }} →</a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
