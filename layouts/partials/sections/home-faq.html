<section class="py-20 border-t border-line">
  <div class="container mx-auto px-6 max-w-6xl grid lg:grid-cols-[4fr_8fr] gap-14">
    <h2 class="text-3xl md:text-4xl font-bold leading-tight">{{ i18n "home_faq_title" }}</h2>
    <div>
      {{ range $i := (seq 5) }}
      <details class="border-b border-line {{ if eq $i 1 }}border-t{{ end }}">
        <summary class="cursor-pointer py-5 font-bold text-lg list-none">{{ i18n (printf "home_faq_q%d" $i) }}</summary>
        <p class="pb-5 text-base-content/80">{{ i18n (printf "home_faq_a%d" $i) }}</p>
      </details>
      {{ end }}
    </div>
  </div>
</section>
