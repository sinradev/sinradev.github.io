<section class="py-0">
  <div class="container mx-auto px-6 max-w-6xl grid md:grid-cols-3 border-t border-b border-line">
    {{ range $i := (seq 3) }}
    <div class="py-8 {{ if gt $i 1 }}md:pl-8 md:border-l border-line{{ end }} {{ if gt $i 1 }}border-t md:border-t-0 border-line{{ end }}">
      <strong class="block text-xl font-bold">{{ i18n (printf "home_sovereignty_fact%d_title" $i) }}</strong>
      <p class="mt-2 text-base-content/80">{{ i18n (printf "home_sovereignty_fact%d_text" $i) }}</p>
    </div>
    {{ end }}
  </div>
</section>
