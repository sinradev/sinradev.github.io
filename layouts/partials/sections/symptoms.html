{{ $lang := .Language.Lang }}
{{ $s := index hugo.Data $lang "home_symptoms" }}
{{ with $s }}
<section class="symptoms py-20 bg-base-200">
  <div class="container mx-auto px-6 max-w-3xl text-center">
    <h2 class="text-3xl md:text-4xl font-bold mb-10">{{ .title }}</h2>
    <div class="space-y-4 text-left">
      {{ range .paragraphs }}
      <p class="text-lg text-base-content/80 leading-relaxed">{{ . }}</p>
      {{ end }}
    </div>
    {{ with .conclusion }}
    <p class="text-xl font-semibold mt-8">{{ . }}</p>
    {{ end }}
  </div>
</section>
{{ end }}
