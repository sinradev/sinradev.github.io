<section class="py-20 border-t border-line">
  <div class="container mx-auto px-6 max-w-6xl grid lg:grid-cols-[5fr_7fr] gap-16">
    <div>
      <h2 class="text-3xl md:text-4xl font-bold leading-tight max-w-[16ch]">{{ i18n "home_symptoms_title" }}</h2>
      <p class="mt-5 text-base-content/80 max-w-[42ch]">{{ i18n "home_symptoms_intro" }}</p>
    </div>
    <div>
      <ul class="symptoms border-t border-line">
        {{ range $i := (seq 3) }}
        <li class="grid sm:grid-cols-2 gap-8 py-6 border-b border-line">
          <span class="font-bold text-lg leading-snug">{{ i18n (printf "home_symptoms_pain_%d" $i) }}</span>
          <span class="fix text-base-content/80">{{ i18n (printf "home_symptoms_fix_%d" $i) | safeHTML }}</span>
        </li>
        {{ end }}
      </ul>
      <p class="mt-8 text-2xl font-bold leading-snug">{{ i18n "home_symptoms_verdict" }}</p>
    </div>
  </div>
</section>
