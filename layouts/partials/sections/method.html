{{ $lang := .Language.Lang }}
{{ $m := index hugo.Data $lang "home_method" }}
{{ with $m }}
<section class="method py-20 bg-base-100">
  <div class="container mx-auto px-6 max-w-6xl">
    <div class="text-center mb-16 max-w-3xl mx-auto">
      <h2 class="text-3xl md:text-4xl font-bold mb-6">{{ .title }}</h2>
      <p class="text-lg text-base-content/80 leading-relaxed">{{ .intro }}</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      {{ range .steps }}
      <div class="method-step bg-base-200 rounded-xl p-6 text-center">
        <div class="text-3xl font-bold text-primary mb-3">{{ .number }}</div>
        <h3 class="text-lg font-bold mb-2">{{ .title }}</h3>
        <p class="text-base-content/70 text-sm leading-relaxed">{{ .description }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
