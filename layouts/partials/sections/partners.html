{{ $lang := .Language.Lang }}
{{ $p := index hugo.Data $lang "home_partners" }}
{{ with $p }}
<section class="partners py-20 bg-base-200">
  <div class="container mx-auto px-6 max-w-3xl text-center">
    <h2 class="text-3xl md:text-4xl font-bold mb-6">{{ .title }}</h2>
    <p class="text-lg text-base-content/80 leading-relaxed mb-8">{{ .body }}</p>
    <ul class="text-left inline-block space-y-2 mb-8">
      {{ range .perks }}
      <li class="flex items-start gap-3">
        <svg class="w-5 h-5 text-primary shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
        </svg>
        <span>{{ . }}</span>
      </li>
      {{ end }}
    </ul>
    <div>
      <a href="{{ relLangURL "contact/" }}" class="btn btn-primary btn-lg">{{ .cta_text }}</a>
    </div>
  </div>
</section>
{{ end }}
