# Home — symptômes
home_symptoms_title: "Vous reconnaissez votre équipe ?"
home_symptoms_intro: "Ce ne sont pas des problèmes de talent. Ils apparaissent dans toute équipe qui a grandi plus vite que sa méthode de travail."
home_symptoms_pain_1: "Les deadlines glissent à chaque cycle, et personne ne sait vraiment pourquoi."
home_symptoms_fix_1: "Les <b>cycles</b> sont dimensionnés selon la disponibilité réelle de chacun : la surcharge apparaît avant que le cycle commence."
home_symptoms_pain_2: "Une fonctionnalité est « terminée » côté dev, mais personne ne l'a testée avant la mise en production."
home_symptoms_fix_2: "Une <b>release</b> ne peut se clôturer avant que chaque test lié soit accepté ou explicitement écarté."
home_symptoms_pain_3: "À une semaine de la release, personne ne peut dire ce qui part vraiment."
home_symptoms_fix_3: "<b>Chaque issue</b> est liée à une capability et à une release : la réponse est à portée d'écran."
home_symptoms_verdict: "C'est un problème de méthode. sinra livre la méthode."

