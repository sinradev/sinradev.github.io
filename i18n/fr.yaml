# Home — FAQ
home_faq_title: "Les questions que les équipes posent en premier"
home_faq_q1: "Mon équipe ne connaît aucune méthode agile, est-ce un problème ?"
home_faq_a1: "Non, c'est justement le cas prévu. Vous suivez les quatre notions de sinra, la méthode suit."
home_faq_q2: "Combien de temps faut-il pour démarrer ?"
home_faq_a2: "Quelques minutes. Créez un compte et configurez votre premier projet, sans rien installer."
home_faq_q3: "Peut-on importer notre backlog existant ?"
home_faq_a3: "Oui, depuis un CSV avec correspondance automatique pour Jira, Asana, Azure DevOps et Linear, ou directement depuis GitHub."
home_faq_q4: "L'essai gratuit est-il limité ?"
home_faq_a4: "14 jours, toutes les fonctionnalités, sans carte bancaire."
home_faq_q5: "sinra est-il adapté aux entreprises réglementées ?"
home_faq_a5: "Il maintient le lien entre specs, développement, tests et releases. Voir nos pages dédiées medtech et fintech pour le détail."

