# Home — síntomas
home_symptoms_title: "¿Tu equipo se parece a esto?"
home_symptoms_intro: "No son problemas de talento. Aparecen en todo equipo que creció más rápido que su forma de trabajar."
home_symptoms_pain_1: "Los plazos se retrasan en cada ciclo, y nadie sabe realmente por qué."
home_symptoms_fix_1: "Los <b>cycles</b> se dimensionan según la disponibilidad real de cada persona: la sobrecarga se ve antes de que el ciclo empiece."
home_symptoms_pain_2: "Una funcionalidad está «terminada» en desarrollo, pero nadie la probó antes de producción."
home_symptoms_fix_2: "Una <b>release</b> no puede cerrarse hasta que cada test vinculado esté aceptado o descartado explícitamente."
home_symptoms_pain_3: "A una semana de la release, nadie puede decir qué se entrega realmente."
home_symptoms_fix_3: "<b>Cada issue</b> está vinculada a una capability y a una release: la respuesta está a una pantalla de distancia."
home_symptoms_verdict: "Es un problema de método. sinra entrega el método."

