# Home — symptoms
home_symptoms_title: "Does your team look like this?"
home_symptoms_intro: "These aren't talent problems. They show up in every team that grew faster than its way of working."
home_symptoms_pain_1: "Deadlines slip every sprint, and nobody knows why."
home_symptoms_fix_1: "<b>Cycles</b> are sized to each person's real availability, so overload shows before the cycle starts."
home_symptoms_pain_2: "A feature is \"done\" but nobody tested it before production."
home_symptoms_fix_2: "<b>Releases</b> can't close until every linked test is accepted or explicitly waived."
home_symptoms_pain_3: "A week before release, nobody can say what's shipping."
home_symptoms_fix_3: "<b>Every issue</b> is tied to a capability and a release, so the answer is one screen away."
home_symptoms_verdict: "It's a method problem. sinra ships the method."

