# Home — FAQ
home_faq_title: "Questions teams ask first"
home_faq_q1: "My team doesn't know any agile method. Is that a problem?"
home_faq_a1: "No, that's the expected case. You follow sinra's four concepts and the method follows."
home_faq_q2: "How long does it take to get started?"
home_faq_a2: "A few minutes. Create an account and set up your first project, with nothing to install."
home_faq_q3: "Can we import our existing backlog?"
home_faq_a3: "Yes, from CSV with automatic mapping for Jira, Asana, Azure DevOps and Linear, or directly from GitHub."
home_faq_q4: "Is the trial limited?"
home_faq_a4: "14 days, every feature, no credit card."
home_faq_q5: "Is sinra suited to regulated companies?"
home_faq_a5: "It keeps the trail between specs, development, tests and releases. See the medtech and fintech pages for details."

